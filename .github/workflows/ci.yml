name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Unit Tests & Protocol Verification
    runs-on: ubuntu-24.04  # ubuntu-latest no longer offers Python 3.8 and 3.9
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests/ -v

      - name: Test CLI Dry-Run & Offline Help
        run: |
          ./audezeforlinux --help
          ./audezeforlinux doctor
          ./audezeforlinux firmware --help
          ./audezeforlinux firmware check
          ./audezeforlinux --dry-run status
